<section class="choose_avatar-section">
<div class="choose_avatar-card">
    <div class="choose_avatar-header">
        <img (click)="goBack()" src="assets/logo/arrow_back.png" alt="Back Logo" class="logo" />
        <h1 >Wähle deinen Avatar</h1>
    </div>

  <form class="choose_avatar-form">
    <div class="form_content">
        <img src="assets/logo/Profile.png" alt="Avatar Logo">
        <p>Name</p>
    </div>
    <div class="form_image">
        <p>Aus der Liste wählen</p>
        <div class="choose_avatar-avatar-list">
            <img src="assets/img/avatar/avatar-1.png" alt="Avatar 1">
            <img src="assets/img/avatar/avatar-2.png" alt="Avatar 2">
            <img src="assets/img/avatar/avatar-3.png" alt="Avatar 3">
            <img src="assets/img/avatar/avatar-4.png" alt="Avatar 4">
            <img src="assets/img/avatar/avatar-5.png" alt="Avatar 5">
            <img src="assets/img/avatar/avatar-6.png" alt="Avatar 6">
        </div>
    </div>

    <div class="actions">
      <button type="submit" class="primary-button" routerLink="/send-email">
        Weiter
      </button>

    </div>
  </form>
</div>
</section>
