<section class="send_email-section">
<div class="send_email-card">
    <div class="send_email-header">
        <img (click)="goBack()" src="assets/logo/arrow_back.png" alt="Back Logo" class="logo" />
        <h1 >Passwort zurücksetzen</h1>
    </div>

  <p class="send_email-description">
    Bitte geben Sie Ihre E-Mail-Adresse ein.
  </p>

  <form class="send_email-form">
    <div class="input-wrapper">
      <img src="assets/logo/mail.png" alt="Mail Logo" />
      <input type="email" placeholder="beispielname@email.com" />
    </div>

    <div>
        <p class="send_email-description">
            Wir senden Ihnen eine E-Mail, über die Sie Ihr Passwort ändern können.
        </p>
    </div>

    <div class="actions">
      <button type="submit" routerLink="/choose-avatar" class="primary-button" routerLink="/reset-password">
        Email senden
      </button>

    </div>
  </form>
</div>
</section>
