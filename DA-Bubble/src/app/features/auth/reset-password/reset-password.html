<section class="reset-section">
<div class="reset-card">
    <div class="reset-header">
        <img (click)="goBack()" src="assets/logo/arrow_back.png" alt="Back Logo" class="logo" />
        <h1 >Passwort zurücksetzen</h1>
    </div>

  <form class="reset-form">
    <div class="input-wrapper">
      <input type="password" placeholder="Neues Passwort" />
    </div>
    <div class="input-wrapper">
      <input type="password" placeholder="Neues Kennwort bestätigen" />
    </div>

    <div class="actions">
      <button type="submit" routerLink="/choose-avatar" class="primary-button">
        Passwort ändern
      </button>

    </div>
  </form>
</div>
</section>
