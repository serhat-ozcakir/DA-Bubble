<section class="sign-up-section">
<div class="sign-up-card">
    <div class="sign-up-header">
        <img (click)="goBack()" src="assets/logo/arrow_back.png" alt="Back Logo" class="logo" />
        <h1 >Konto erstellen</h1>
    </div>

  <p class="sign-up-description">
    Mit deinem Namen und deiner E-Mail-Adresse hast du dein neues DABubble-Konto.
  </p>

  <form class="sign-up-form">
    <div class="input-wrapper">
    <img src="assets/logo/person_filled.png" alt="Person Logo" />
      <input type="text" placeholder="Name und Nachname" />
    </div>

    <div class="input-wrapper">
      <img src="assets/logo/mail.png" alt="Mail Logo" />
      <input type="email" placeholder="beispielname@email.com" />
    </div>

    <div class="input-wrapper">
      <img src="assets/logo/lock.png" alt="Lock Logo" />
      <input type="password" placeholder="Passwort" />
    </div>

    <div class="input-wrapper-checkbox">
      <input type="checkbox" id="terms" />
      <label for="terms">Ich akzeptiere die <a  routerLink="/Datenschuz" target="_blank">Datenschutzerklärung</a> zu.</label>
    </div>

    <div class="actions">
      <button type="submit" class="primary-button">
        Weiter
      </button>

    </div>
  </form>
</div>
</section>
