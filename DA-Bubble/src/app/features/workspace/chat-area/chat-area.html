<div class="chat-area">
    @if(showNewMessage()){
    <app-new-message (messageSent)="closeNewMessageEmit()"></app-new-message>
    } @else {
        <app-chat-header 
        (openShowProfil)="openShowProfil.emit()"
        (openMemberList)="openMemberList.emit()" 
        (openAddMembers)="openAddMembers.emit()"
        (openChannelSettings)="openChannelSettings.emit()" 
        />
        <app-message-list />
        <app-message-input />
    }
</div>
