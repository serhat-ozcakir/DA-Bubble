<div class="chat-header">
  <div class="chat-header__left">

    @if (directMessageService.currentDmUser(); as dmUser){
      <img [src]="directMessageService.currentDmUser()?.avatar" alt="User avatar" />
    <span class="chat-header__title">{{dmUser.name}}</span>
    } @else {
    <span class="chat-header__hash">#</span>
    <span class="chat-header__title">{{ channelService.currentChannel()?.name || 'Kein Kanal ausgewählt' }}</span>
    <img class="chat-header__arrow" src="assets/icons/keyboard_arrow_down.png" alt="" />
    }
  </div>

    @if (directMessageService.currentDmUser(); as dmUser){

    } @else {

      <div class="chat-header__right">
        <div class="chat-header__members">
          <img src="assets/img/avatar/avatar-1.png" alt="Noah Braun" />
          <img src="assets/img/avatar/avatar-2.png" alt="Sofia Müller" />
          <img src="assets/img/avatar/avatar-3.png" alt="Frederik Beck" />
        </div>
    
        <span class="chat-header__member-count">3</span>
    
        <button class="chat-header__add-member" type="button" (click)="openDialog()">
          <img src="assets/logo/Add-members.png" alt="Mitglied hinzufügen" />
        </button>
      </div>
    }
</div>
