<div class="message-input">
  @if(directMessageService.currentDmUser()){
  <textarea placeholder="Nachricht an  {{directMessageService.currentDmUser()?.name}}"
  [(ngModel)]="messageText"
  (keydown.enter)="sendMessage()"
  ></textarea>
  } @else {
      <textarea placeholder="Nachricht an # {{channelService.currentChannel()?.name}}"
  [(ngModel)]="messageText"
  (keydown.enter)="sendMessage()"
  ></textarea>
  }


  <div class="message-input__footer">
    <div class="message-input__actions">
      <button type="button">😊</button>
      <button type="button">@</button>
    </div>

    <button class="message-input__send" type="button" (click)="sendMessage()">
      <img src="assets/icons/send.png" alt="send">
    </button>
  </div>
</div>
