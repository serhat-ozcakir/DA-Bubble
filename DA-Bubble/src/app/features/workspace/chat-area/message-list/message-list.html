<div class="message-list">
  @for (message of getMessages(); track message.id; let index = $index) {
    @if (shouldShowDate(getMessages(), index)) {
      <div class="message-list__date-line">
        <span>
          {{ formatMessageDate(message.createdAt) }}
        </span>
      </div>
    }
    <app-message-item
      [message]="message"
    ></app-message-item>
  }
</div>
