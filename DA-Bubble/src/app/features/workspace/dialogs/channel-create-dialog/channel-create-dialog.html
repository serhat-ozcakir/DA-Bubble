<div class="dialog-backdrop" (click)="close()">
  <div class="dialog" (click)="$event.stopPropagation()">
    <button class="dialog__close" type="button" (click)="close()">
        <img src="assets/icons/close.png" alt="close logo">
    </button>

    <h2>Channel erstellen</h2>

    <p class="dialog__text">
      Channels dienen deinem Team zur Kommunikation. Am besten sollten sie
      themenbezogen sein #marketing zum Beispiel.
    </p>

    <label class="dialog__label">Channel-Name</label>

    <div class="dialog__input">
      <span>#</span>
      <input type="text" placeholder="z.B. Office-Team" />
    </div>

    <label class="dialog__label">
      Beschreibung <span>(optional)</span>
    </label>

    <div class="dialog__description">
        <input type="text" placeholder="Dein Text hier" />
    </div>

    <div class="dialog__actions">
      <button class="dialog__submit" type="button">Erstellen</button>
    </div>
  </div>
</div>
