<div class="profile-dialog">
    <div class="profile-dialog__content-wrapper">
        <div class="profile-dialog__header">
            <h2>Profil</h2>
            <button type="button" class="close-button" (click)="close()">X</button>
        </div>
        <div class="profile-dialog__content">
            <img [src]="auth.currentUserProfile()?.avatar" alt="User avatar" class="profile-dialog__avatar" />
            <div class="profile-dialog__info">
                <h4>{{ auth.currentUserProfile()?.name }}</h4>
                <button type="button" class="edit-button">Bearbeiten</button>
            </div>
            <span class="profile-dialog__status">Status: Aktif</span>
        </div>
        <div class="profile-dialog__footer">
            <div>
                <img src="assets/logo/mail-1.png" alt="Online status icon" class="status-icon" />
                <span>E-mail Adresse</span>
            </div>
            <p>{{ auth.currentUserProfile()?.email }}</p>
        </div>
    </div>
</div>
