<div class="profile-dialog">
    <div class="profile-dialog__content-wrapper">
        <div class="profile-dialog__header">
            <h2>Profil</h2>
            <button type="button" class="close-button" (click)="close()">X</button>
        </div>
        <div class="profile-dialog__content">
            <img [src]="auth.currentUserProfile()?.avatar" alt="User avatar" class="profile-dialog__avatar" />
            <div class="profile-dialog__info">
                <h4>{{ auth.currentUserProfile()?.name }}</h4>
                @if(!authService.isGuestUser()){
                    <button type="button" class="edit-button" (click)="openEditProfileDialog()">Bearbeiten</button>

                }
            </div>
            <div class="profile-dialog__status-indicator" [class.online]="auth.currentUserProfile()?.status === 'online'" [class.offline]="auth.currentUserProfile()?.status === 'offline'">
                <span class="status-indicator__dot" ></span>
                <span class="profile-dialog__status" [class.online]="auth.currentUserProfile()?.status === 'online'" [class.offline]="auth.currentUserProfile()?.status === 'offline'">
                    {{ auth.currentUserProfile()?.status }}
                </span>
            </div>

            
        </div>
<div class="profile-dialog__footer">
    @if (!auth.isGuestUser()) {
        <div>
            <img
                src="assets/logo/mail-1.png"
                alt="E-Mail"
                class="status-icon"
            />
            <span>E-Mail Adresse</span>
        </div>

        <p>{{ auth.currentUserProfile()?.email }}</p>
    } @else {
        <div class="profile-dialog__guest-info">
            <span>Gastkonto</span>
        </div>
    }
</div>
    </div>
</div>
