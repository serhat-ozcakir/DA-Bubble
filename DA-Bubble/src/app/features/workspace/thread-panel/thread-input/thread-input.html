<div class="thread-input">
  <textarea 
  [(ngModel)]="replyText"
    placeholder="Antworten..."
    (keydown.enter)="handleEnter($event)"
  ></textarea>

  <div class="thread-input__footer">
    <div class="thread-input__actions">
      <button type="button" (click)="toggleEmojiPicker()">
        <img src="assets/icons/sentiment_satisfied.png" alt="emoji">
      </button>
      @if(showEmojiPicker){
      <div class="emoji-picker">
        <emoji-mart 
        set="apple" [showPreview]="false" 
        [isNative]="true" 
        [emojiSize]="22" 
        [perLine]="6"
        [exclude]="['flags']" 
        (emojiClick)="addEmoji($event)">
        </emoji-mart>
      </div>
      }
      <button type="button">
        <img src="assets\icons\alternate_email.png" alt="mention">
      </button>
    </div>

    <button class="thread-input__send" type="button" (click)="sendReply()">
      <img src="assets/icons/send.png" alt="send">
    </button>
  </div>
</div>
