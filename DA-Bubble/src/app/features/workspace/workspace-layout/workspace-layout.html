<div class="workspace">
  <app-header></app-header>

  <main class="workspace__content"
   [class.sidebar-closed]="isSidebarClosed"
   [class.thread-open] = isThreadOpen
   >
    <app-sidebar (openCreateChannel)="openCreateChannelDialog()"></app-sidebar>

    <button class="workspace__sidebar-toggle" type="button" (click)="toggleSidebar()">
      <div class="workspace__toggle-content">
        @if (isSidebarClosed) {
        <span> Workspace-Menü öffnen </span>
        <img src="assets\icons\Group 2.png" alt="sidebar icon" />
        } @else {
        <span> Workspace-Menü schließen </span>
        <img src="assets\icons\Group 3.png" alt="sidebar icon" />
        }

      </div>
    </button>
    <app-chat-area (openAddMembers)="openAddMembersDialog()">

    </app-chat-area>
    @if(showAddMemberDialog()){
      <app-add-members-dialag (closeAddMemberDialog)="closeAddMembersDialog()"></app-add-members-dialag>
    }

    @if(isThreadOpen){
    <app-thread-panel></app-thread-panel>
    }
  </main>
</div>

@if(showCreateChannelDialog()){
<app-channel-create-dialog (closeDialog)="closeCreateChannelDialog()"
>

</app-channel-create-dialog>
}
